about: >-
  I'm an AI and full-stack engineer based in Cairo. I joined Fixed Solutions as an intern in 2024
  and now work there as an AI engineer, building computer vision, OCR and LLM features that have to
  work on real data. I build the whole path around a model: the backend and database, the interface
  people use, and the deploy that keeps it running.

services:
  - title: AI features
    text: Vision, OCR, LLM and RAG features that work on real data.
    tools: [OpenCV, YOLO, PaddleOCR, InsightFace, PyTorch, ONNX, llama-index, Hugging Face]
  - title: Full-stack apps
    text: FastAPI and PostgreSQL backends, React frontends, admin dashboards, auth and APIs.
    tools: [FastAPI, PostgreSQL, SQLAlchemy, React, Flutter]
  - title: Data pipelines
    text: Moving, cleaning and modeling data, from messy sources to tables you can trust.
    tools: [Python, pandas, PySpark, Airflow, MongoDB, PostgreSQL, scikit-learn]
  - title: Deployment
    text: Docker, CI/CD with GitHub Actions, and running and monitoring in production.
    tools: [Docker, GitHub Actions]
servicesClosing: I can deliver the whole thing, or the part you need.

process:
  - title: Plan
    text: We agree on scope, architecture and a timeline before any code is written.
  - title: Build
    text: Model, backend and frontend, shipped in small releases that already work.
  - title: Ship
    text: Deployed to production and tested with real users.
  - title: Support
    text: Fixes, monitoring and improvements after launch.

